name: build

on:
  push:
    branches: [main]
    paths: [Dockerfile]
  pull_request:
    paths: [Dockerfile, .github/workflows/build.yml]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          echo "caddy=$(grep -m1 -oP 'FROM caddy:\K[0-9.]+' Dockerfile)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.caddy }}
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Create release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.meta.outputs.image }}
          CADDY: ${{ steps.meta.outputs.caddy }}
          SHA: ${{ steps.meta.outputs.sha }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          tag="v${CADDY}-sha-${SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, skipping"
            exit 0
          fi

          plugins=$(grep -oP -- '--with \K\S+' Dockerfile | sed 's/^/- `/; s/$/`/')

          cat > notes.md <<EOF
          ## Image

          \`\`\`sh
          docker pull ${IMAGE}:${CADDY}
          docker pull ${IMAGE}:sha-${SHA}
          docker pull ${IMAGE}@${DIGEST}
          \`\`\`

          ## Contents

          - Caddy \`${CADDY}\`
          ${plugins}

          EOF

          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Caddy ${CADDY} (${SHA})" \
            --notes-file notes.md \
            --generate-notes
